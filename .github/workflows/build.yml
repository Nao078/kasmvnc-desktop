name: build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nao078/kasmvnc-desktop

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Phase 2でここに debian-12 を追加する（distros/debian-12.env が必要）。
        distro: [ubuntu-24.04]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load distro build args
        run: grep -v '^\s*#' "distros/${{ matrix.distro }}.env" | grep -v '^\s*$' >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          load: true
          tags: kasmvnc-desktop:${{ matrix.distro }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            KASMVNC_VERSION=${{ env.KASMVNC_VERSION }}
            KASMVNC_CODENAME=${{ env.KASMVNC_CODENAME }}
            KASMVNC_SHA256=${{ env.KASMVNC_SHA256 }}
          cache-from: type=gha,scope=${{ matrix.distro }}
          cache-to: type=gha,mode=max,scope=${{ matrix.distro }}

      - name: Run smoke tests
        run: tests/smoke.sh kasmvnc-desktop:${{ matrix.distro }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push floating distro tag (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "kasmvnc-desktop:${{ matrix.distro }}" "${REGISTRY}/${IMAGE_NAME}:${{ matrix.distro }}"
          docker push "${REGISTRY}/${IMAGE_NAME}:${{ matrix.distro }}"

      - name: Push immutable semver tag (version tags only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker tag "kasmvnc-desktop:${{ matrix.distro }}" "${REGISTRY}/${IMAGE_NAME}:${{ matrix.distro }}-${version}"
          docker push "${REGISTRY}/${IMAGE_NAME}:${{ matrix.distro }}-${version}"
